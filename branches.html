<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branches - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="navbar-container"></div>
            <div class="content-body">
                <div class="flex justify-between items-center" style="margin-bottom:1.5rem;">
                    <div><h2 style="font-weight:600;font-size:1.25rem;">Branches &amp; outlets</h2><p style="color:var(--text-muted);margin-top:.35rem;">Manage locations in this business. Switch the active branch from the top bar.</p></div>
                    <button id="add-branch-btn" class="btn btn-primary"><i data-lucide="plus"></i><span>Add branch</span></button>
                </div>
                <div id="branches-notice" class="card" style="display:none;margin-bottom:1rem;padding:1rem;"></div>
                <div class="card"><div id="branches-table-container"></div></div>
            </div>
        </main>
    </div>
    <script type="module" src="assets/js/branches/branches.js"></script>
</body>
</html>
