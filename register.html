<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-main);
        }
        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">
    <div class="card register-card">
        <div class="login-header">
            <div class="login-logo">
                <i data-lucide="cpu" style="width: 48px; height: 48px;"></i>
            </div>
            <h2 style="font-weight: 700; font-size: 1.5rem; margin-bottom: 0.25rem;">Create Account</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Join JoeTech Store Manager</p>
        </div>
        <form id="register-form">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input class="form-control" type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-control" type="email" id="email" required placeholder="admin@joetech.com">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" required placeholder="Min. 6 characters" minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input class="form-control" type="password" id="confirmPassword" required placeholder="Repeat password">
            </div>
            <div class="form-group">
                <label class="form-label" for="role">Role</label>
                <select id="role" class="form-control" required>
                    <option value="admin">Admin</option>
                    <option value="manager">Manager</option>
                    <option value="cashier">Cashier</option>
                    <option value="inventory_officer">Inventory Officer</option>
                    <option value="viewer">Viewer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                <span>Create Account</span>
                <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
            </button>
        </form>
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
            <p>Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign in</a></p>
        </div>
    </div>

    <script type="module" src="assets/js/auth/register.js"></script>
</body>
</html>
