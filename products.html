<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/products.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <div class="content-body">
                <!-- Action Bar -->
                <div class="flex justify-between items-center" style="margin-bottom: 1.5rem;">
                    <div class="flex gap-2" style="flex: 1; max-width: 500px;">
                        <input type="text" id="product-search" class="form-control"
                            placeholder="Search products by name, SKU, or barcode...">
                        <select id="category-filter" class="form-control" style="max-width: 150px;">
                            <option value="">All Categories</option>
                            <option value="Smartphones">Smartphones</option>
                            <option value="Laptops">Laptops</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>
                    <button id="add-product-btn" class="btn btn-primary">
                        <i data-lucide="plus"></i>
                        <span>Add Product</span>
                    </button>
                </div>

                <!-- Products Table Card -->
                <div class="card">
                    <div id="products-table-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/products/productList.js"></script>
</body>

</html>
