<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <div class="content-body">
                <h2 style="font-weight: 600; font-size: 1.25rem; margin-bottom: 1.5rem;">Finance Management</h2>
                
                <div class="grid grid-cols-3 gap-4" style="margin-bottom: 2rem;">
                    <div class="card" onclick="window.location.href='cash-flow.html'">
                        <div class="flex items-center gap-3">
                            <i data-lucide="trending-up" style="width: 24px; height: 24px; color: var(--success);"></i>
                            <div>
                                <h4 style="font-weight: 600; font-size: 0.875rem;">Cash Flow</h4>
                                <p style="font-size: 0.75rem; color: var(--text-muted);">Track money movement</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card" onclick="window.location.href='bank-accounts.html'">
                        <div class="flex items-center gap-3">
                            <i data-lucide="building-2" style="width: 24px; height: 24px; color: var(--primary);"></i>
                            <div>
                                <h4 style="font-weight: 600; font-size: 0.875rem;">Bank Accounts</h4>
                                <p style="font-size: 0.75rem; color: var(--text-muted);">Manage accounts</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card" onclick="window.location.href='daily-cash-book.html'">
                        <div class="flex items-center gap-3">
                            <i data-lucide="book-open" style="width: 24px; height: 24px; color: var(--info);"></i>
                            <div>
                                <h4 style="font-weight: 600; font-size: 0.875rem;">Daily Cash Book</h4>
                                <p style="font-size: 0.75rem; color: var(--text-muted);">Daily transactions</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1rem;">Financial Overview</h3>
                    <div id="finance-overview-container">
                        <p style="color: var(--text-muted);">Financial summary will appear here.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="assets/js/finance/finance.js"></script>
</body>
</html>
