<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-main);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="card auth-card">
        <div class="login-header">
            <div class="login-logo">
                <i data-lucide="lock" style="width: 48px; height: 48px; color: var(--primary);"></i>
            </div>
            <h2 style="font-weight: 700; font-size: 1.5rem; margin-bottom: 0.25rem;">Reset Password</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Enter your new password below</p>
        </div>
        <form id="reset-form">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-control" type="email" id="email" required placeholder="admin@joetech.com">
            </div>
            <div class="form-group">
                <label class="form-label" for="newPassword">New Password</label>
                <input class="form-control" type="password" id="newPassword" required placeholder="Min. 6 characters" minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
                <input class="form-control" type="password" id="confirmNewPassword" required placeholder="Repeat new password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                <span>Reset Password</span>
                <i data-lucide="check" style="width: 18px; height: 18px;"></i>
            </button>
        </form>
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
            <p>Remember your password? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign in</a></p>
        </div>
    </div>

    <script type="module" src="assets/js/auth/resetPassword.js"></script>
</body>
</html>
