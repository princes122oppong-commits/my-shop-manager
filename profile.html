<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <div class="content-body">
                <h2 style="font-weight: 600; font-size: 1.25rem; margin-bottom: 1.5rem;">My Profile</h2>
                
                <div class="grid grid-cols-3 gap-4">
                    <!-- Profile Info -->
                    <div class="card" style="grid-column: span 2;">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1.5rem;">Personal Information</h3>
                        <form id="profile-form">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="profile-name" class="form-control">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" id="profile-email" class="form-control" disabled>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Phone</label>
                                <input type="tel" id="profile-phone" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </form>
                    </div>

                    <!-- Security -->
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1.5rem;">Security</h3>
                        <form id="password-form">
                            <div class="form-group">
                                <label class="form-label">Current Password</label>
                                <input type="password" id="current-password" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">New Password</label>
                                <input type="password" id="new-password" class="form-control" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Confirm New Password</label>
                                <input type="password" id="confirm-new-password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Change Password</button>
                        </form>
                    </div>

                    <!-- Login History -->
                    <div class="card" style="grid-column: span 3;">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1rem;">Recent Login Activity</h3>
                        <div id="login-history-container">
                            <p style="color: var(--text-muted);">Loading...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/profile/profile.js"></script>
</body>
</html>
