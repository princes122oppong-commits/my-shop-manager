<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/inventory.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <div class="content-body">
                <!-- Action Bar -->
                <div class="flex justify-between items-center" style="margin-bottom: 1.5rem;">
                    <h2 style="font-weight: 600; font-size: 1.25rem;">Stock Management</h2>
                    <div class="flex gap-2">
                        <button id="stock-in-btn" class="btn btn-success">
                            <i data-lucide="arrow-down-left"></i>
                            <span>Stock In</span>
                        </button>
                        <button id="stock-out-btn" class="btn btn-danger">
                            <i data-lucide="arrow-up-right"></i>
                            <span>Stock Out</span>
                        </button>
                    </div>
                </div>

                <!-- Inventory Grid -->
                <div class="grid grid-cols-3 gap-4">
                    <!-- Stock Levels Table -->
                    <div class="card" style="grid-column: span 2;">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1rem;">Current Stock Levels
                        </h3>
                        <div id="stock-levels-table"></div>
                    </div>

                    <!-- Movement History -->
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1rem;">Recent Movements</h3>
                        <div id="movement-history-list" class="flex flex-col gap-3"
                            style="max-height: 500px; overflow-y: auto;">
                            <!-- Dynamic list -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/inventory/inventory.js"></script>
</body>

</html>
