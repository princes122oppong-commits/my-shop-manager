<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <div class="content-body">
                <div class="flex justify-between items-center" style="margin-bottom: 1.5rem;">
                    <h2 style="font-weight: 600; font-size: 1.25rem;">Promotions & Marketing</h2>
                    <button id="add-promotion-btn" class="btn btn-primary">
                        <i data-lucide="plus"></i>
                        <span>Create Promotion</span>
                    </button>
                </div>
                
                <div class="grid grid-cols-2 gap-4" style="margin-bottom: 2rem;">
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1rem;">Active Promotions</h3>
                        <div id="promotions-list"></div>
                    </div>
                    
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1rem;">Coupon Codes</h3>
                        <div id="coupons-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="assets/js/marketing/promotions.js"></script>
</body>
</html>
