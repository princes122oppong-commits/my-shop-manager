<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-main);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            animation: slideDown 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="card login-card">
        <div class="login-header">
            <div class="login-logo">
                <i data-lucide="cpu" style="width: 48px; height: 48px;"></i>
            </div>
            <h2 style="font-weight: 700; font-size: 1.5rem; margin-bottom: 0.25rem;">Welcome Back</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to manage your store</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-control" type="email" id="email" name="email" required
                    placeholder="admin@joetech.com">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" required
                    placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                <span>Sign In</span>
                <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
        </form>
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
            <p>Demo Credentials:</p>
            <p style="font-weight: 500; color: var(--text-main);">admin@joetech.com / admin</p>
        </div>
    </div>

    <script type="module" src="assets/js/auth/login.js"></script>
</body>

</html>
