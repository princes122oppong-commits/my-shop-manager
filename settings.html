<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - JoeTech Store Manager</title>
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/sidebar.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="navbar-container"></div>
            <div class="content-body">
                <h2 style="font-weight: 600; font-size: 1.25rem; margin-bottom: 1.5rem;">Settings</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Store Settings -->
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1.5rem;">Store Information</h3>
                        <form id="store-settings-form">
                            <div class="form-group">
                                <label class="form-label">Store Name</label>
                                <input type="text" id="setting-storeName" class="form-control" value="JoeTech Store">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Currency</label>
                                <select id="setting-currency" class="form-control">
                                    <option value="USD">USD - US Dollar</option>
                                    <option value="EUR">EUR - Euro</option>
                                    <option value="GBP">GBP - British Pound</option>
                                    <option value="GHS">GHS - Ghanaian Cedi</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Tax Rate (%)</label>
                                <input type="number" id="setting-taxRate" class="form-control" value="8.25" step="0.01">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Low Stock Threshold</label>
                                <input type="number" id="setting-lowStockThreshold" class="form-control" value="10">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Settings</button>
                        </form>
                    </div>

                    <!-- Theme Settings -->
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1.5rem;">Appearance</h3>
                        <div class="form-group">
                            <label class="form-label">Theme</label>
                            <select id="setting-theme" class="form-control">
                                <option value="light">Light Mode</option>
                                <option value="dark">Dark Mode</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Language</label>
                            <select class="form-control">
                                <option>English</option>
                                <option>Spanish</option>
                                <option>French</option>
                            </select>
                        </div>
                    </div>

                    <!-- Notification Settings -->
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1.5rem;">Notifications</h3>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="setting-enableEmailNotifications" checked>
                                <span>Email Notifications</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="setting-enableSMSNotifications">
                                <span>SMS Notifications</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" id="setting-enable2FA">
                                <span>Two-Factor Authentication</span>
                            </label>
                        </div>
                    </div>

                    <!-- Backup & Data -->
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 1.5rem;">Data Management</h3>
                        <div class="flex flex-col gap-2">
                            <button id="export-data-btn" class="btn btn-secondary">
                                <i data-lucide="download"></i>
                                <span>Export Data (CSV)</span>
                            </button>
                            <button id="import-data-btn" class="btn btn-secondary">
                                <i data-lucide="upload"></i>
                                <span>Import Data</span>
                            </button>
                            <button id="clear-data-btn" class="btn btn-danger">
                                <i data-lucide="trash-2"></i>
                                <span>Clear All Data</span>
                            </button>
                        </div>
                    </div>

                    <!-- Database Connection -->
                    <div class="card">
                        <h3 style="font-weight: 600; font-size: 1.125rem; margin-bottom: 0.5rem;">Database Connection</h3>
                        <p id="supabase-status" style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1rem;"></p>
                        <form id="supabase-form">
                            <div class="form-group">
                                <label class="form-label" for="supabase-url">Supabase Project URL</label>
                                <input type="url" id="supabase-url" class="form-control" placeholder="https://your-project.supabase.co">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="supabase-key">Supabase Anon Key</label>
                                <input type="password" id="supabase-key" class="form-control" placeholder="Your public anon key">
                            </div>
                            <div class="flex gap-2">
                                <button type="submit" class="btn btn-primary">Connect Supabase</button>
                                <button type="button" id="disconnect-supabase-btn" class="btn btn-secondary">Use Offline Mode</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/settings/settings.js"></script>
</body>
</html>
